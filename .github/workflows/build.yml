name: Build (iOS signed + macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
      - run: flutter pub get

      - name: Import signing certificate & provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed .ipa
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: fido2demo-ios
          path: build/ios/ipa/*.ipa

  macos:
    runs-on: macos-latest
    env:
      TEAM_ID: RA5A5W7PJB
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get

      # Mac Development 証明書をキーチェーンに取り込み、macOS プロビジョニング
      # プロファイルをファイルに展開する。
      - name: Import macOS signing assets
        env:
          P12_BASE64: ${{ secrets.MAC_DEV_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEV_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/mac_dev.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/mac.provisionprofile

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/mac_dev.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build macOS
        run: flutter build macos --release

      # flutter のビルドは ad-hoc 署名なので、プロビジョニングプロファイルを
      # 埋め込み、Development 証明書 + entitlements でアプリ全体を再署名する。
      - name: Embed profile & re-sign
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          cp $RUNNER_TEMP/mac.provisionprofile "$APP/Contents/embedded.provisionprofile"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m1 -E "Apple Development|Mac Develop" | awk '{print $2}')
          echo "identity: $IDENTITY"

          # 手動署名なので Xcode の自動注入が無い。プロビジョニングプロファイルに
          # 含まれる application-identifier / team-identifier / capability を
          # entitlements として明示し、それで再署名する。
          cat > $RUNNER_TEMP/ci.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.application-identifier</key>
          	<string>RA5A5W7PJB.jp.co.sonrisa.fido2demo</string>
          	<key>com.apple.developer.team-identifier</key>
          	<string>RA5A5W7PJB</string>
          	<key>com.apple.developer.aps-environment</key>
          	<string>development</string>
          	<key>com.apple.developer.associated-domains</key>
          	<array>
          		<string>webcredentials:oidc.sonrisa.co.jp?mode=developer</string>
          		<string>applinks:oidc.sonrisa.co.jp</string>
          	</array>
          	<key>com.apple.security.app-sandbox</key>
          	<true/>
          	<key>com.apple.security.network.client</key>
          	<true/>
          	<key>com.apple.security.network.server</key>
          	<true/>
          </dict>
          </plist>
          EOF
          # ヒアドキュメントの行頭インデントを除去して正しい plist にする。
          sed -i '' 's/^          //' $RUNNER_TEMP/ci.entitlements

          # 入れ子のフレームワーク/ライブラリを先に署名してからアプリ本体を署名する。
          find "$APP/Contents/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do codesign --force --timestamp=none --sign "$IDENTITY" "$f"; done
          codesign --force --timestamp=none \
            --entitlements $RUNNER_TEMP/ci.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" || true

      - name: Package .app
        run: |
          cd build/macos/Build/Products/Release
          zip -qry fido2demo-macos.zip *.app
      - uses: actions/upload-artifact@v4
        with:
          name: fido2demo-macos
          path: build/macos/Build/Products/Release/fido2demo-macos.zip

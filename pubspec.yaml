name: dart_dpop
description: Reusable Dart implementation of DPoP (Demonstrating Proof of Possession, RFC 9449) with pluggable key store and HTTP middleware.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  pointycastle: ^3.9.0
  cryptography: ^2.7.0
  http: ^1.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
